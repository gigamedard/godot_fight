version: '3.8'

services:
  db:
    image: mysql:8
    container_name: web3_combat_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: web3_combat
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  api:
    image: laravelsail/php82-composer:latest
    container_name: web3_combat_api
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
      - "8081:8081"
    command: >
      bash -c "if [ ! -f artisan ]; then
                 echo 'Initialisation du projet Laravel...';
                 composer create-project --prefer-dist laravel/laravel tmp_app;
                 mv tmp_app/* tmp_app/.[!.]* . 2>/dev/null;
                 rmdir tmp_app;
               fi;
               php artisan reverb:start --host=0.0.0.0 --port=8081 &
               php artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      - db

  frontend:
    image: nginx:alpine
    container_name: web3_combat_frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  db_data:
