version: '3.8'

services:
  db:
    image: mysql:8
    container_name: web3_combat_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: web3_combat
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  blockchain:
    build:
      context: ./blockchain
    container_name: web3_combat_blockchain
    restart: unless-stopped
    ports:
      - "8545:8545"
    volumes:
      - ./blockchain:/app
      - /app/node_modules

  api:
    build:
      context: ./backend
    container_name: web3_combat_api
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
      - "8081:8081"
    depends_on:
      - db
      - blockchain

  frontend:
    build:
      context: ./frontend
    container_name: web3_combat_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  db_data:
