# Stack conteneurisée de Web3 Combat Game, alignée sur le runtime réel :
#   - blockchain  : Hardhat node + déploiement du contrat (port 8545)
#   - indexer     : watcher node des événements on-chain -> API interne Laravel
#   - api         : Laravel (artisan serve) + Reverb (WebSocket) + MySQL
#   - db          : MySQL 8 (stockage applicatif Laravel)
#   - frontend    : serveur statique Python (Godot Web export)

services:
  blockchain:
    build:
      context: ./blockchain
    container_name: web3_combat_blockchain
    restart: unless-stopped
    ports:
      - "8545:8545"
    volumes:
      - ./blockchain:/app
      - /app/node_modules

  db:
    image: mysql:8.0
    container_name: web3_combat_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: web3_combat
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  indexer:
    build:
      context: ./indexer
    container_name: web3_combat_indexer
    restart: unless-stopped
    environment:
      RPC_URL: ws://blockchain:8545
      RPC_HTTP_URL: http://blockchain:8545
      API_URL: http://api:8000/api/internal
      INDEXER_SECRET: super_secret_indexer_token
      CONTRACT_ADDRESS: 0x5FbDB2315678afecb367f032d93F642f64180aa3
      ARTIFACT_PATH: /srv/blockchain/artifacts/contracts/CombatGame.sol/CombatGame.json
      # --- Indexation robuste (polling + reorg safety + idempotence) ---
      DEPLOYMENT_BLOCK: 0
      CONFIRMATIONS_REQUIRED: 5
      POLL_INTERVAL_MS: 2000
      MAX_BLOCK_RANGE: 1000
      BACKOFF_BASE_MS: 2000
      BACKOFF_MAX_MS: 30000
      # --- MySQL (persistance d'état) ---
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: user
      DB_PASSWORD: password
      DB_DATABASE: web3_combat
    volumes:
      - ./blockchain:/srv/blockchain:ro
    depends_on:
      - blockchain
      - api
      - db

  api:
    build:
      context: ./backend
    container_name: web3_combat_api
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      # Le backend lance les scripts node (settle/consolidate) : ils doivent
      # joindre le nœud via le nom de service et lire leurs scripts montés.
      WEB3_RPC_URL: http://blockchain:8545
      WEB3_BACKEND_URL: http://127.0.0.1:8000/api
      WEB3_BACKEND_SIGNER_KEY: 0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d
      WEB3_SETTLE_SCRIPT: /srv/blockchain/scripts/settle_fight.js
      WEB3_CONSOLIDATE_SCRIPT: /srv/blockchain/scripts/consolidate_pool.js
      WEB3_WITHDRAW_PUSH_SCRIPT: /srv/blockchain/scripts/withdraw_push.js
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: web3_combat
      DB_USERNAME: user
      DB_PASSWORD: password
    volumes:
      - ./backend:/var/www/html
      - ./blockchain:/srv/blockchain:ro
    ports:
      - "8000:8000"
      - "8081:8081"
    depends_on:
      - blockchain
      - db

  frontend:
    build:
      context: ./frontend
    container_name: web3_combat_frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
      - "8444:8444"
      - "8445:8445"
    volumes:
      - ./frontend:/srv/www:ro

volumes:
  db_data:
