# Stack conteneurisée de Web3 Combat Game, alignée sur le runtime réel :
#   - blockchain  : Hardhat node + déploiement du contrat (port 8545)
#   - indexer     : watcher node des événements on-chain -> API interne Laravel
#   - api         : Laravel (artisan serve) + Reverb (WebSocket) + SQLite
#   - frontend    : serveur statique Python (Godot Web export)

services:
  blockchain:
    build:
      context: ./blockchain
    container_name: web3_combat_blockchain
    restart: unless-stopped
    ports:
      - "8545:8545"
    volumes:
      - ./blockchain:/app
      - /app/node_modules

  indexer:
    build:
      context: ./indexer
    container_name: web3_combat_indexer
    restart: unless-stopped
    environment:
      RPC_URL: ws://blockchain:8545
      API_URL: http://api:8000/api/internal
      INDEXER_SECRET: super_secret_indexer_token
      CONTRACT_ADDRESS: 0x5FbDB2315678afecb367f032d93F642f64180aa3
      ARTIFACT_PATH: /srv/blockchain/artifacts/contracts/CombatGame.sol/CombatGame.json
    volumes:
      - ./blockchain:/srv/blockchain:ro
    depends_on:
      - blockchain
      - api

  api:
    build:
      context: ./backend
    container_name: web3_combat_api
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      # Le backend lance les scripts node (settle/consolidate) : ils doivent
      # joindre le nœud via le nom de service et lire leurs scripts montés.
      WEB3_RPC_URL: http://blockchain:8545
      WEB3_BACKEND_URL: http://127.0.0.1:8000/api
      WEB3_BACKEND_SIGNER_KEY: 0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d
      WEB3_SETTLE_SCRIPT: /srv/blockchain/scripts/settle_fight.js
      WEB3_CONSOLIDATE_SCRIPT: /srv/blockchain/scripts/consolidate_pool.js
    volumes:
      - ./backend:/var/www/html
      - ./blockchain:/srv/blockchain:ro
    ports:
      - "8000:8000"
      - "8081:8081"
    depends_on:
      - blockchain

  frontend:
    build:
      context: ./frontend
    container_name: web3_combat_frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/srv/www:ro
