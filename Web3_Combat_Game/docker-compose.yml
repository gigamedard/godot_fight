# Stack conteneurisée de Web3 Combat Game — cible L1 Pingala Chain (chainId 99999).
# Le nœud Hardhat local a été RETIRÉ : plus de service `blockchain` en production.
# Les contrats sont déployés sur Pingala (blockchain/scripts/deploy.js) et la
# stack consomme le RPC public Pingala.
#   - indexer  : watcher node des événements on-chain -> API interne Laravel
#   - api      : Laravel (artisan serve) + Reverb (WebSocket) + MySQL
#   - db       : MySQL 8 (stockage applicatif Laravel)
#   - frontend : serveur statique Python (Godot Web export)
#
# NB : les services `indexer` et `api` montent ./blockchain (artifacts + scripts).
# Compiler les artifacts avant `docker compose up` : (cd blockchain && npx hardhat compile)

services:
  db:
    image: mysql:8.0
    container_name: web3_combat_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: web3_combat
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  indexer:
    build:
      context: ./indexer
    container_name: web3_combat_indexer
    restart: unless-stopped
    environment:
      # --- L1 Pingala Chain (chainId 99999) ---
      RPC_HTTP_URL: https://31.187.72.98.sslip.io/ext/bc/2bU2988XvYbG4z85k39QxhDNomHWREnTKzYWLViU1RMCeSwEea/rpc
      API_URL: http://api:8000/api/internal
      INDEXER_SECRET: super_secret_indexer_token
      # Adresse renseignée après déploiement (blockchain/deployments.pingala.json).
      CONTRACT_ADDRESS: 0xA2722921B753C1E76e1d9a4294204DF983746C3D
      ARTIFACT_PATH: /srv/blockchain/artifacts/contracts/CombatGame.sol/CombatGame.json
      # --- Indexation robuste (polling + reorg safety + idempotence) ---
      # DEPLOYMENT_BLOCK : bloc réel de déploiement sur Pingala (pas 0).
      DEPLOYMENT_BLOCK: 171
      # NOTE : cette L1 ne produit des blocs QUE sur transaction (pas de blocs
      # vides). Avec >0 confirmations, l'indexation attend le bloc suivant et
      # peut stagner en test solo. La finalité Avalanche/quick rend 0 acceptable.
      CONFIRMATIONS_REQUIRED: 0
      POLL_INTERVAL_MS: 2000
      MAX_BLOCK_RANGE: 1000
      BACKOFF_BASE_MS: 2000
      BACKOFF_MAX_MS: 30000
      # --- MySQL (persistance d'état) ---
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: user
      DB_PASSWORD: password
      DB_DATABASE: web3_combat
    volumes:
      - ./blockchain:/srv/blockchain:ro
    depends_on:
      - api
      - db

  api:
    build:
      context: ./backend
    container_name: web3_combat_api
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      # Le backend lance les scripts node (settle/consolidate) : ils signent et
      # paient le gaz sur Pingala, donc le backendSigner doit être fundé en TST.
      WEB3_RPC_URL: https://31.187.72.98.sslip.io/ext/bc/2bU2988XvYbG4z85k39QxhDNomHWREnTKzYWLViU1RMCeSwEea/rpc
      WEB3_BACKEND_URL: http://127.0.0.1:8000/api
      # Clé du backendSigner (adresse fraîche ≠ owner, fundée en TST) : lue depuis
      # backend/.env (WEB3_BACKEND_SIGNER_KEY), monté dans le conteneur. Jamais ici.
      CONTRACT_ADDRESS: 0xA2722921B753C1E76e1d9a4294204DF983746C3D
      WEB3_SETTLE_SCRIPT: /srv/blockchain/scripts/settle_fight.js
      WEB3_CONSOLIDATE_SCRIPT: /srv/blockchain/scripts/consolidate_pool.js
      WEB3_WITHDRAW_PUSH_SCRIPT: /srv/blockchain/scripts/withdraw_push.js
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: web3_combat
      DB_USERNAME: user
      DB_PASSWORD: password
    volumes:
      - ./backend:/var/www/html
      - ./blockchain:/srv/blockchain:ro
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8081:8081"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: web3_combat_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8444:8444"
      - "127.0.0.1:8445:8445"
    volumes:
      - ./frontend:/srv/www:ro

volumes:
  db_data:
