<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Big Choco — mage en capuche, runes violettes -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#25123a"/>
      <stop offset="100%" stop-color="#0a0412"/>
    </radialGradient>
    <radialGradient id="cap" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#5a2ea6"/>
      <stop offset="100%" stop-color="#2c1458"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="58" r="42" fill="none" stroke="#7B2CBF" stroke-opacity="0.4" stroke-width="2"/>
  <!-- capuche -->
  <path d="M34 84 C30 58 44 34 60 34 C76 34 90 58 86 84 Z" fill="url(#cap)"/>
  <path d="M38 84 Q60 92 82 84 L86 120 L34 120 Z" fill="#1d0c3d"/>
  <!-- intérieur capuche (ombre visage) -->
  <path d="M46 78 C48 58 52 52 60 52 C68 52 72 58 74 78 Z" fill="#0a0412"/>
  <!-- yeux lumineux -->
  <ellipse cx="54" cy="62" rx="3" ry="4" fill="#c77dff"/>
  <ellipse cx="66" cy="62" rx="3" ry="4" fill="#c77dff"/>
  <!-- runes -->
  <path d="M44 44 L48 38 L52 44 M68 44 L72 38 L76 44" stroke="#c77dff" stroke-width="2" fill="none" opacity="0.9"/>
  <circle cx="60" cy="32" r="2.5" fill="#c77dff" opacity="0.8"/>
  <!-- étoiles magiques -->
  <path d="M26 52 l2.5 4.5 4.5 2.5 -4.5 2.5 -2.5 4.5 -2.5 -4.5 -4.5 -2.5 4.5 -2.5 Z" fill="#c77dff" opacity="0.5"/>
  <path d="M90 66 l2 3.6 3.6 2 -3.6 2 -2 3.6 -2 -3.6 -3.6 -2 3.6 -2 Z" fill="#c77dff" opacity="0.5"/>
</svg>
