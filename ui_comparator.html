<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparateur UI — Kit IA vs Prototype Rigoureux</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', sans-serif;
        background: #0a0a12;
        color: #e0e0e0;
        height: 100vh;
        display: flex;
        flex-direction: column;
    }
    header {
        background: linear-gradient(90deg, #1a1a2e, #16213e);
        padding: 14px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 2px solid #ffc700;
        flex-shrink: 0;
    }
    header h1 {
        font-size: 1.1rem;
        letter-spacing: 1px;
    }
    header h1 span { color: #00e5ff; }
    .header-actions { display: flex; gap: 12px; }
    .header-actions a {
        color: #00e5ff; text-decoration: none; font-size: 0.85rem;
        border: 1px solid #00e5ff33; padding: 6px 14px; border-radius: 4px;
        transition: all 0.2s;
    }
    .header-actions a:hover { background: #00e5ff22; border-color: #00e5ff; }
    main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        min-height: 0;
    }
    .panel {
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-right: 1px solid #2a2a3e;
    }
    .panel:last-child { border-right: none; }
    .panel-label {
        padding: 8px 16px;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        background: #12121f;
        border-bottom: 1px solid #2a2a3e;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
    }
    .panel-label .tag { font-size: 0.65rem; padding: 2px 8px; border-radius: 3px; }
    .tag-ia { background: #ff0055; color: #fff; }
    .tag-moi { background: #00e676; color: #000; }
    .panel-frame { flex: 1; min-height: 0; }
    .panel-frame iframe {
        width: 100%; height: 100%; border: none; display: block;
    }
    .banner {
        position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
        background: rgba(20,20,35,0.95); border: 1px solid #ffc700;
        padding: 8px 18px; border-radius: 20px;
        font-size: 0.75rem; color: #ffc700; z-index: 999;
        box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        pointer-events: none;
    }
    @media (max-width: 900px) {
        main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
        .panel { border-right: none; border-bottom: 1px solid #2a2a3e; }
    }
</style>
</head>
<body>

<header>
    <h1>⚔️ Comparateur UI — <span>BATTLEPOOL Spirit Fight</span></h1>
    <div class="header-actions">
        <a href="ui_ai_kit_demo.html" target="_blank">Ouvrir Kit IA ↗</a>
        <a href="ui_neostreetfighter_prototype.html" target="_blank">Ouvrir Mon Prototype ↗</a>
    </div>
</header>

<main>
    <div class="panel">
        <div class="panel-label">
            <span>📦 KIT IA (vision)</span>
            <span class="tag tag-ia">DIRECTION ARTISTIQUE IA</span>
        </div>
        <div class="panel-frame">
            <iframe src="ui_ai_kit_demo.html" loading="eager"></iframe>
        </div>
    </div>
    <div class="panel">
        <div class="panel-label">
            <span>🔧 MON PROTOTYPE (rigoureux)</span>
            <span class="tag tag-moi">INTERPRÉTATION STRICTE</span>
        </div>
        <div class="panel-frame">
            <iframe src="ui_neostreetfighter_prototype.html" loading="eager"></iframe>
        </div>
    </div>
</main>

<div class="banner">↓ Faites défiler les 2 prototypes : Splash → Langue → Wallet → Mode → Personnage → Lobby</div>

</body>
</html>
